<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Fly Design research workflow</title>
  <desc id="description">A single-pass workflow from research question through literature, hypothesis, and critic agents to a proposal with review notes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#648078"/>
    </marker>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#104e40"/>
      <stop offset="1" stop-color="#176b55"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18382e" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1100" height="640" rx="24" fill="#f5f8f5"/>
  <text x="56" y="65" font-size="14" font-weight="700" letter-spacing="2" fill="#176b55">FLY DESIGN / WORKFLOW</text>
  <text x="56" y="104" font-size="28" font-weight="700" fill="#172b26">From research question to reviewed proposal</text>
  <text x="56" y="132" font-size="15" fill="#61736d">One focused pass. No automatic retries.</text>

  <rect x="56" y="188" width="215" height="130" rx="16" fill="#fff" stroke="#dce6e0" filter="url(#shadow)"/>
  <circle cx="86" cy="220" r="15" fill="#eaf4ee"/>
  <text x="86" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#176b55">01</text>
  <text x="78" y="261" font-size="17" font-weight="700" fill="#172b26">Research question</text>
  <text x="78" y="286" font-size="13" fill="#61736d">Topic, phenotype, or genes</text>
  <text x="78" y="305" font-size="13" fill="#61736d">to investigate</text>

  <line x1="271" y1="253" x2="302" y2="253" stroke="#648078" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="188" width="215" height="130" rx="16" fill="#fff" stroke="#dce6e0" filter="url(#shadow)"/>
  <circle cx="340" cy="220" r="15" fill="#eaf4ee"/>
  <text x="340" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#176b55">02</text>
  <text x="332" y="261" font-size="17" font-weight="700" fill="#172b26">Literature</text>
  <text x="332" y="286" font-size="13" fill="#61736d">FlyBase genes &amp; stocks</text>
  <text x="332" y="305" font-size="13" fill="#61736d">PubMed papers &amp; research gaps</text>

  <line x1="525" y1="253" x2="556" y2="253" stroke="#648078" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="564" y="188" width="215" height="130" rx="16" fill="#fff" stroke="#dce6e0" filter="url(#shadow)"/>
  <circle cx="594" cy="220" r="15" fill="#eaf4ee"/>
  <text x="594" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#176b55">03</text>
  <text x="586" y="261" font-size="17" font-weight="700" fill="#172b26">Hypothesis</text>
  <text x="586" y="286" font-size="13" fill="#61736d">Falsifiable claim and</text>
  <text x="586" y="305" font-size="13" fill="#61736d">experimental plan</text>

  <line x1="779" y1="253" x2="810" y2="253" stroke="#648078" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="818" y="188" width="226" height="130" rx="16" fill="#fff" stroke="#dce6e0" filter="url(#shadow)"/>
  <circle cx="848" cy="220" r="15" fill="#fff4df"/>
  <text x="848" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#a56b13">04</text>
  <text x="840" y="261" font-size="17" font-weight="700" fill="#172b26">Independent critique</text>
  <text x="840" y="286" font-size="13" fill="#61736d">Feasibility, evidence,</text>
  <text x="840" y="305" font-size="13" fill="#61736d">controls, and scoring</text>

  <line x1="931" y1="318" x2="931" y2="370" stroke="#648078" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="234" y="382" width="630" height="116" rx="18" fill="url(#header)" filter="url(#shadow)"/>
  <text x="274" y="422" font-size="13" font-weight="700" letter-spacing="1.5" fill="#bde4ce">FINAL OUTPUT</text>
  <text x="274" y="456" font-size="21" font-weight="700" fill="#fff">Research proposal + critic feedback</text>
  <text x="274" y="480" font-size="14" fill="#e0efe5">Review notes stay attached; the draft is not regenerated automatically.</text>

  <line x1="549" y1="498" x2="549" y2="536" stroke="#648078" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="546" width="180" height="52" rx="12" fill="#fff" stroke="#dce6e0"/>
  <text x="450" y="578" text-anchor="middle" font-size="14" font-weight="600" fill="#31443d">Supabase session</text>
  <rect x="558" y="546" width="180" height="52" rx="12" fill="#fff" stroke="#dce6e0"/>
  <text x="648" y="578" text-anchor="middle" font-size="14" font-weight="600" fill="#31443d">Word document</text>
  <line x1="549" y1="536" x2="450" y2="546" stroke="#648078" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="549" y1="536" x2="648" y2="546" stroke="#648078" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
