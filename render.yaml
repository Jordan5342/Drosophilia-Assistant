services:
  - type: web
    name: drosophila-assistant
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: GEMINI_CRITIC_MODEL
        value: gemini-2.5-flash
      - key: PYTHON_VERSION
        value: 3.11.0
